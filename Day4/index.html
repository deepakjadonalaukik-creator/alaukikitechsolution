```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Login Form -->
        <div class="form-box">
            <h2>Login</h2>

            <form id="loginForm" novalidate>

                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input
                        type="text"
                        id="loginEmail"
                        placeholder="Enter your email"
                    >
                    <small class="error" id="loginEmailError"></small>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                    >
                    <small class="error" id="loginPasswordError"></small>
                </div>

                <button type="submit">Login</button>

                <p class="success" id="loginSuccess"></p>
            </form>
        </div>

        <!-- Registration Form -->
        <div class="form-box">
            <h2>Register</h2>

            <form id="registerForm" novalidate>

                <div class="input-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="text"
                        id="registerEmail"
                        placeholder="Enter your email"
                    >
                    <small class="error" id="registerEmailError"></small>
                </div>

                <div class="input-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                    >
                    <small class="error" id="registerPasswordError"></small>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                    >
                    <small class="error" id="confirmPasswordError"></small>
                </div>

                <button type="submit">Register</button>

                <p class="success" id="registerSuccess"></p>
            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
```
