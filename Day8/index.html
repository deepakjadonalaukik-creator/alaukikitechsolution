
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 8 - Dynamic Task Management</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <div>
                <p class="subtitle">DAY 08 • JAVASCRIPT PROJECT</p>
                <h1>Task<span>Flow</span></h1>
                <p class="description">
                    Manage your tasks dynamically.
                </p>
            </div>
        </header>

        <!-- Add Task Form -->
        <section class="task-section">

            <h2>Create a New Task</h2>

            <form id="taskForm" class="task-form">

                <div class="form-group">
                    <label for="taskTitle">Task Title</label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter your task title..."
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        placeholder="Describe your task..."
                        rows="3"
                        maxlength="500"
                    ></textarea>
                </div>

                <button type="submit" class="add-btn">
                    <span>+</span> Add Task
                </button>

                <p id="formError" class="error" role="alert"></p>

            </form>

        </section>


        <!-- Task List -->
        <section class="task-section task-list-section">

            <div class="section-header">
                <div>
                    <h2>My Tasks</h2>
                    <p class="description">
                        Your tasks appear here.
                    </p>
                </div>

                <span class="task-count">
                    Total: <strong id="taskCount">0</strong>
                </span>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>
                <h3>No tasks yet!</h3>
                <p>Add your first task to get started.</p>
            </div>

            <!-- Dynamic Tasks Render Here -->
            <div id="taskList" class="task-list"></div>

        </section>


        <footer class="footer">
            <p>© 2026 TaskFlow</p>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
