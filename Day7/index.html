
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Creation Modal</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="subtitle">MY WORKSPACE</p>
                <h1>My Tasks <span>✦</span></h1>
                <p class="description">
                    Create and manage your daily tasks.
                </p>
            </div>

            <button type="button" class="add-btn" id="addTaskBtn">
                <span>+</span> Add Task
            </button>
        </header>


        <!-- Task List -->
        <section class="task-section">

            <div class="section-header">
                <h2>My Task List</h2>
                <span class="task-count" id="taskCount">0 tasks</span>
            </div>

            <div class="task-list" id="taskList">

                <!-- New tasks will appear here -->

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h3>No tasks yet</h3>
                    <p>Click "Add Task" to create your first task.</p>
                </div>

            </div>

        </section>


        <!-- Modal Overlay -->
        <div
            class="modal-overlay"
            id="taskModal"
            aria-hidden="true"
            hidden
        >

            <!-- Modal Content -->
            <div
                class="modal-content"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modalTitle"
                aria-describedby="modalDescription"
            >

                <!-- Modal Header -->
                <div class="modal-header">
                    <div>
                        <h2 id="modalTitle">Create New Task</h2>
                        <p id="modalDescription">
                            Add details for your new task below.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="close-btn"
                        id="closeModalBtn"
                        aria-label="Close modal"
                    >
                        &times;
                    </button>
                </div>


                <!-- Task Form -->
                <form id="taskForm" novalidate>

                    <div class="form-group">
                        <label for="taskTitle">Task Title</label>

                        <input
                            type="text"
                            id="taskTitle"
                            placeholder="e.g. Learn JavaScript"
                            maxlength="100"
                            required
                        >

                        <small class="error" id="titleError"></small>
                    </div>


                    <div class="form-group">
                        <label for="taskDescription">Description</label>

                        <textarea
                            id="taskDescription"
                            placeholder="Describe your task..."
                            rows="4"
                            maxlength="500"
                            required
                        ></textarea>

                        <small class="error" id="descriptionError"></small>
                    </div>


                    <!-- Modal Buttons -->
                    <div class="modal-actions">

                        <button
                            type="button"
                            class="cancel-btn"
                            id="cancelBtn"
                        >
                            Cancel
                        </button>

                        <button type="submit" class="save-btn">
                            Save Task
                        </button>

                    </div>

                </form>

            </div>
        </div>


        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 TaskFlow | Day 7 Project</p>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
